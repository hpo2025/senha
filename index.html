<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas Avançado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Gerador de Senhas Pro</h2>
    
    <div class="output-group">
      <input type="text" id="password" readonly placeholder="Sua senha aparecerá aqui">
      <button id="copy-btn">Copiar</button>
    </div>

    <div class="controls">
      <div class="control-row">
        <label for="length">Tamanho: <span id="length-value">16</span></label>
        <input type="range" id="length" min="6" max="32" value="16">
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="uppercase" checked> Incluir Maiúsculas (A-Z)</label>
        <label><input type="checkbox" id="lowercase" checked> Incluir Minúsculas (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Incluir Números (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Incluir Símbolos (!@#$%...)</label>
        <label><input type="checkbox" id="exclude-ambiguous"> Evitar Caracteres Confusos ({ } [ ] / \ ~)</label>
      </div>
    </div>

    <div class="strength-meter">
      <span>Força:</span>
      <div id="strength-indicator"></div>
      <span id="strength-text">-</span>
    </div>

    <button id="generate-btn">Gerar Senha</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
