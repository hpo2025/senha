<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Gerador de Senhas Safe</h2>
    <input type="text" id="password" readonly placeholder="Sua senha aparecerá aqui">
    
    <div class="controls">
      <label for="length">Tamanho da senha:</label>
      <input type="number" id="length" min="6" max="32" value="12">
    </div>

    <button id="generate-btn">Gerar Senha</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
